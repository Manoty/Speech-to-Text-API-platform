version: "3.9"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: always

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.prod
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    restart: always
    deploy:
      replicas: 2           # two API instances behind nginx
      resources:
        limits:
          cpus: "2"
          memory: 2G

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.prod
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - uploads_data:/app/uploads
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    restart: always
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G        # whisper needs memory

  beat:
    build:
      context: .
      dockerfile: deploy/Dockerfile.prod
    env_file: .env
    depends_on:
      - redis
    command: celery -A app.workers.celery_app beat --loglevel=info
    restart: always

  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    env_file: .env
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads_data: